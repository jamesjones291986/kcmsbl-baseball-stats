<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splits - Baseball Stats</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>📊 Splits</h1>
    <nav>
      <a href="./">Hitting</a>
      <a href="pitching.html">Pitching</a>
      <a href="gamelogs/">Game Logs</a>
      <a href="royals/">WS Royals</a>
    </nav>
  </header>

  <main>
    <section id="filters">
      <label>Year:
        <select id="yearFilter"><option value="">All</option></select>
      </label>
      <label>Team:
        <select id="teamFilter"><option value="">All</option></select>
      </label>
      <label>Min games:
        <input id="minGames" type="number" min="1" step="1" placeholder="1" style="width:60px">
      </label>
    </section>

    <section id="splits">
      <div id="statMode" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <button class="split-tab active" onclick="showMode('batting', this)">Batting</button>
        <button class="split-tab" onclick="showMode('pitching', this)">Pitching</button>
      </div>
      <div id="splitTabs" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        <button class="split-tab active" onclick="showSplit('field', this)">By Field</button>
        <button class="split-tab" onclick="showSplit('opponent', this)">By Opponent</button>
        <button class="split-tab" onclick="showSplit('daynight', this)">Day / Night</button>
        <button class="split-tab" onclick="showSplit('team', this)">By Team</button>
        <button class="split-tab" onclick="showSplit('time', this)">By Time</button>
        <button class="split-tab" onclick="showSplit('season', this)">Regular / Playoff</button>
      </div>
      <div class="table-wrap">
        <table id="splitsTable">
          <thead id="splitsHead"><tr>
            <th class="sortable" data-col="label">Split</th>
            <th class="sortable" data-col="g">G</th>
            <th class="sortable" data-col="ab">AB</th>
            <th class="sortable" data-col="h">H</th>
            <th class="sortable" data-col="doubles">2B</th>
            <th class="sortable" data-col="triples">3B</th>
            <th class="sortable" data-col="hr">HR</th>
            <th class="sortable" data-col="rbi">RBI</th>
            <th class="sortable" data-col="r">R</th>
            <th class="sortable" data-col="bb">BB</th>
            <th class="sortable" data-col="k">K</th>
            <th class="sortable" data-col="sb">SB</th>
            <th class="sortable" data-col="avg">AVG</th>
            <th class="sortable" data-col="obp">OBP</th>
            <th class="sortable" data-col="slg">SLG</th>
            <th class="sortable" data-col="ops">OPS</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script>
    // GAME_LOG_YEARS loaded from config.js — every year with a game log,
    // including partial ones (2020-2021 are CH A's only)
    let allGames = [];
    let currentSplit = 'field';
    let statMode = 'batting';
    let sortCol = 'avg';
    let sortDir = 'desc'; // desc = highest first

    // Column headers per stat mode. `key` matches the row object field; `def`
    // is the default sort column when switching into that mode.
    const MODE_COLUMNS = {
      batting: {
        def: 'avg',
        cols: [
          ['label','Split'],['g','G'],['ab','AB'],['h','H'],['doubles','2B'],
          ['triples','3B'],['hr','HR'],['rbi','RBI'],['r','R'],['bb','BB'],
          ['k','K'],['sb','SB'],['avg','AVG'],['obp','OBP'],['slg','SLG'],['ops','OPS']
        ]
      },
      pitching: {
        def: 'era',
        cols: [
          ['label','Split'],['g','G'],['gs','GS'],['ip','IP'],['h','H'],
          ['r','R'],['er','ER'],['bb','BB'],['k','K'],['w','W'],['l','L'],
          ['sv','SV'],['era','ERA'],['whip','WHIP']
        ]
      }
    };

    // Sort header click handler
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('sortable')) {
        const col = e.target.dataset.col;
        if (sortCol === col) {
          sortDir = sortDir === 'desc' ? 'asc' : 'desc';
        } else {
          sortCol = col;
          sortDir = col === 'label' ? 'asc' : 'desc'; // text defaults A-Z, numbers default high-low
        }
        renderSplits();
      }
    });

    // KC sunset times by month (approximate, 24h decimal)
    const KC_SUNSETS = {
      1:17.25, 2:18.0, 3:19.5, 4:20.0, 5:20.5, 6:20.75,
      7:20.75, 8:20.25, 9:19.5, 10:18.75, 11:17.25, 12:17.0
    };

    function parseTime(timeStr) {
      if (!timeStr) return null;
      const m = timeStr.match(/(\d+):(\d+)\s*(am|pm)/i);
      if (!m) return null;
      let h = parseInt(m[1]); const min = parseInt(m[2]); const ampm = m[3].toLowerCase();
      if (ampm === 'pm' && h !== 12) h += 12;
      if (ampm === 'am' && h === 12) h = 0;
      return h + min / 60;
    }

    function getDayNight(game) {
      const time = parseTime(game.time);
      if (time === null) return 'Unknown';
      const month = parseInt(game.date.split('-')[1]);
      const sunset = KC_SUNSETS[month] || 19.5;
      return (sunset >= time + 0.75) ? 'Day' : 'Night';
    }

    function computeSplits(games, keyFn) {
      const groups = {};
      games.forEach(g => {
        const key = keyFn(g);
        if (!key) return;
        if (!groups[key]) groups[key] = [];
        groups[key].push(g);
      });
      const rows = [];
      for (const [label, gms] of Object.entries(groups)) {
        const ab = gms.reduce((s, g) => s + g.ab, 0);
        const h = gms.reduce((s, g) => s + g.h, 0);
        const doubles = gms.reduce((s, g) => s + (g['2b'] || 0), 0);
        const triples = gms.reduce((s, g) => s + (g['3b'] || 0), 0);
        const hr = gms.reduce((s, g) => s + (g.hr || 0), 0);
        const rbi = gms.reduce((s, g) => s + (g.rbi || 0), 0);
        const r = gms.reduce((s, g) => s + (g.r || 0), 0);
        const bb = gms.reduce((s, g) => s + (g.bb || 0), 0);
        const k = gms.reduce((s, g) => s + (g.k || 0), 0);
        const sb = gms.reduce((s, g) => s + (g.sb || 0), 0);
        const hbp = gms.reduce((s, g) => s + (g.hb || 0), 0);
        const tb = h + doubles + 2 * triples + 3 * hr;
        const pa = ab + bb + hbp;
        const avg = ab ? (h / ab) : 0;
        const obp = pa ? ((h + bb + hbp) / pa) : 0;
        const slg = ab ? (tb / ab) : 0;
        const ops = obp + slg;
        rows.push({ label, g: gms.length, ab, h, doubles, triples, hr, rbi, r, bb, k, sb, avg, obp, slg, ops });
      }
      return rows.sort((a, b) => b.avg - a.avg);
    }

    // IP is stored in baseball notation (5.1 = 5⅓, 5.2 = 5⅔). Convert to a real
    // number of innings for math, then back to notation for display.
    function ipToOuts(ip) {
      const whole = Math.trunc(ip);
      const frac = Math.round((ip - whole) * 10); // 0, 1, or 2
      return whole * 3 + frac;
    }
    function outsToIp(outs) {
      const whole = Math.trunc(outs / 3);
      const rem = outs % 3;
      return whole + rem / 10; // back to x.0 / x.1 / x.2 notation
    }

    function computePitchingSplits(games, keyFn) {
      const groups = {};
      games.forEach(g => {
        if (!g.pitching) return; // pitching splits only include games pitched
        const key = keyFn(g);
        if (!key) return;
        (groups[key] = groups[key] || []).push(g);
      });
      const rows = [];
      for (const [label, gms] of Object.entries(groups)) {
        const outs = gms.reduce((s, g) => s + ipToOuts(g.pitching.ip || 0), 0);
        const ipReal = outs / 3;
        const h = gms.reduce((s, g) => s + (g.pitching.h || 0), 0);
        const r = gms.reduce((s, g) => s + (g.pitching.r || 0), 0);
        const er = gms.reduce((s, g) => s + (g.pitching.er || 0), 0);
        const bb = gms.reduce((s, g) => s + (g.pitching.bb || 0), 0);
        const k = gms.reduce((s, g) => s + (g.pitching.k || 0), 0);
        const gs = gms.reduce((s, g) => s + (g.pitching.gs || 0), 0);
        const w = gms.reduce((s, g) => s + (g.pitching.w || 0), 0);
        const l = gms.reduce((s, g) => s + (g.pitching.l || 0), 0);
        const sv = gms.reduce((s, g) => s + (g.pitching.s || 0), 0);
        // KCMSBL uses 7-inning games, so ERA is scaled to 7 (matches game log page).
        const era = ipReal ? (er * 7) / ipReal : 0;
        const whip = ipReal ? (h + bb) / ipReal : 0;
        rows.push({
          label, g: gms.length, gs, ip: outsToIp(outs), _ipReal: ipReal,
          h, r, er, bb, k, w, l, sv, era, whip
        });
      }
      return rows;
    }

    function showMode(mode, btn) {
      statMode = mode;
      document.querySelectorAll('#statMode .split-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      sortCol = MODE_COLUMNS[mode].def;
      sortDir = 'desc';
      renderHead();
      renderSplits();
    }

    function renderHead() {
      const tr = MODE_COLUMNS[statMode].cols.map(([col, label]) =>
        `<th class="sortable" data-col="${col}">${label}</th>`
      ).join('');
      document.getElementById('splitsHead').innerHTML = `<tr>${tr}</tr>`;
    }

    function showSplit(type, btn) {
      currentSplit = type;
      document.querySelectorAll('.split-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderSplits();
    }

    function renderSplits() {
      const year = document.getElementById('yearFilter').value;
      const team = document.getElementById('teamFilter').value;
      const filtered = allGames.filter(g => {
        if (year && g.year !== +year) return false;
        if (team && g.team !== team) return false;
        return true;
      });

      let keyFn;
      switch (currentSplit) {
        case 'field': keyFn = g => g.field || 'Unknown'; break;
        case 'opponent': keyFn = g => g.opponent || 'Unknown'; break;
        case 'daynight': keyFn = g => getDayNight(g); break;
        case 'team': keyFn = g => g.team || 'Unknown'; break;
        case 'time': keyFn = g => g.time || 'Unknown'; break;
        // A game is playoff only when explicitly flagged; the absence of the flag
        // means regular season, so the 23 existing entries need no edit.
        case 'season': keyFn = g => g.playoff ? 'Playoff' : 'Regular'; break;
      }

      let rows = statMode === 'pitching'
        ? computePitchingSplits(filtered, keyFn)
        : computeSplits(filtered, keyFn);
      // Minimum games threshold — hide split groups with fewer than N games.
      const minG = parseInt(document.getElementById('minGames').value, 10);
      if (minG > 1) rows = rows.filter(r => r.g >= minG);
      // Sort
      rows.sort((a, b) => {
        const av = a[sortCol], bv = b[sortCol];
        if (typeof av === 'string') {
          return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
        }
        return sortDir === 'asc' ? av - bv : bv - av;
      });
      // Update header arrows
      document.querySelectorAll('.sortable').forEach(th => {
        const arrow = th.dataset.col === sortCol ? (sortDir === 'desc' ? ' ▼' : ' ▲') : '';
        th.textContent = th.textContent.replace(/ [▼▲]$/, '') + arrow;
      });
      const tbody = document.querySelector('#splitsTable tbody');
      if (statMode === 'pitching') {
        const colspan = MODE_COLUMNS.pitching.cols.length;
        tbody.innerHTML = rows.map(r => `<tr>
          <td style="text-align:left;font-weight:500">${r.label}</td>
          <td>${r.g}</td><td>${r.gs}</td><td>${r.ip.toFixed(1)}</td><td>${r.h}</td>
          <td>${r.r}</td><td>${r.er}</td><td>${r.bb}</td><td>${r.k}</td>
          <td>${r.w}</td><td>${r.l}</td><td>${r.sv}</td>
          <td><strong>${r.era.toFixed(2)}</strong></td><td>${r.whip.toFixed(2)}</td>
        </tr>`).join('') || `<tr><td colspan="${colspan}" style="text-align:center;color:#888">No data</td></tr>`;
      } else {
        tbody.innerHTML = rows.map(r => `<tr>
          <td style="text-align:left;font-weight:500">${r.label}</td>
          <td>${r.g}</td><td>${r.ab}</td><td>${r.h}</td><td>${r.doubles}</td><td>${r.triples}</td><td>${r.hr}</td>
          <td>${r.rbi}</td><td>${r.r}</td><td>${r.bb}</td><td>${r.k}</td><td>${r.sb}</td>
          <td><strong>${r.avg.toFixed(3)}</strong></td><td>${r.obp.toFixed(3)}</td><td>${r.slg.toFixed(3)}</td><td>${r.ops.toFixed(3)}</td>
        </tr>`).join('') || '<tr><td colspan="16" style="text-align:center;color:#888">No data</td></tr>';
      }
    }

    function populateFilters() {
      const years = [...new Set(allGames.map(g => g.year))].sort();
      const teams = [...new Set(allGames.map(g => g.team))].sort();
      const yf = document.getElementById('yearFilter');
      years.forEach(y => { const o = document.createElement('option'); o.value = y; o.textContent = y; yf.appendChild(o); });
      const tf = document.getElementById('teamFilter');
      teams.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; tf.appendChild(o); });
    }

    async function init() {
      const results = await Promise.all(
        GAME_LOG_YEARS.map(y => fetch(`data/personal/games/${y}.json`).then(r => r.ok ? r.json() : []).catch(() => []))
      );
      GAME_LOG_YEARS.forEach((y, i) => {
        results[i].forEach(g => allGames.push({...g, year: y}));
      });
      populateFilters();
      renderHead();
      renderSplits();
      document.getElementById('yearFilter').addEventListener('change', renderSplits);
      document.getElementById('teamFilter').addEventListener('change', renderSplits);
      document.getElementById('minGames').addEventListener('input', renderSplits);
    }

    init();
  </script>
</body>
</html>
