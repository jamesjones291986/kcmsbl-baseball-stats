<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splits - Baseball Stats</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">⚾ Baseball Stats</a>
    <nav aria-label="Main">
      <a href="./">Hitting</a>
      <a href="pitching.html">Pitching</a>
      <a href="gamelogs/">Game Logs</a>
      <a href="splits.html" aria-current="page">Splits</a>
      <a href="royals/">World Series</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Splits</h1>

    <div class="toolbar filters">
      <label>Year <select id="yearFilter"><option value="">All</option></select></label>
      <label>Team <select id="teamFilter"><option value="">All</option></select></label>
      <label>Min games <input id="minGames" type="number" min="1" step="1" value="1"></label>
      <button type="button" class="chip" id="moreToggle" aria-pressed="false">More stats</button>
    </div>

    <div class="segmented" id="statMode" role="group" aria-label="Stat type">
      <button type="button" data-mode="batting" aria-pressed="true">Batting</button>
      <button type="button" data-mode="pitching" aria-pressed="false">Pitching</button>
    </div>
    <div class="chip-row" id="splitTabs" role="group" aria-label="Split by">
      <button type="button" class="chip" data-split="field" aria-pressed="true">Field</button>
      <button type="button" class="chip" data-split="opponent" aria-pressed="false">Opponent</button>
      <button type="button" class="chip" data-split="daynight" aria-pressed="false">Day / Night</button>
      <button type="button" class="chip" data-split="team" aria-pressed="false">Team</button>
      <button type="button" class="chip" data-split="time" aria-pressed="false">Start time</button>
      <button type="button" class="chip" data-split="season" aria-pressed="false">Regular / Playoff</button>
    </div>

    <div class="table-wrap">
      <table id="splitsTable"><thead></thead><tbody></tbody></table>
    </div>
    <p class="footnote" id="eraNote" hidden>ERA is runs per 7 innings.</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/stats.js"></script>
  <script>
    const MODES = {
      batting: { def: 'avg', cols: [
        ['label', 'Split'], ['g', 'G'], ['ab', 'AB'], ['r', 'R'], ['h', 'H'], ['2b', '2B', 1], ['3b', '3B', 1],
        ['hr', 'HR'], ['rbi', 'RBI'], ['bb', 'BB'], ['k', 'K'], ['sb', 'SB', 1],
        ['avg', 'AVG'], ['obp', 'OBP'], ['slg', 'SLG'], ['ops', 'OPS']] },
      pitching: { def: 'era', cols: [
        ['label', 'Split'], ['g', 'G'], ['gs', 'GS'], ['ip', 'IP'], ['h', 'H'], ['r', 'R'], ['er', 'ER'],
        ['bb', 'BB'], ['k', 'K'], ['w', 'W'], ['l', 'L'], ['s', 'SV', 1], ['era', 'ERA'], ['whip', 'WHIP']] },
    };
    const RATE = new Set(['avg', 'obp', 'slg', 'ops']);
    let allGames = [], split = 'field', mode = 'batting';
    const state = { col: 'avg', dir: 'desc' };

    // Approximate Kansas City sunset by month, in hours.
    const KC_SUNSETS = { 1: 17.25, 2: 18, 3: 19.5, 4: 20, 5: 20.5, 6: 20.75, 7: 20.75, 8: 20.25, 9: 19.5, 10: 18.75, 11: 17.25, 12: 17 };
    function dayNight(g) {
      const t = timeMinutes(g.time);
      if (t == null) return 'Unknown';
      const sunset = KC_SUNSETS[+g.date.split('-')[1]] || 19.5;
      return sunset >= t / 60 + 0.75 ? 'Day' : 'Night';
    }
    const KEYS = {
      field: g => g.field || 'Unknown', opponent: g => g.opponent || 'Unknown', daynight: dayNight,
      team: g => g.team || 'Unknown', time: g => g.time || 'Unknown',
      // Playoff only when flagged; no flag means regular season.
      season: g => g.playoff ? 'Playoff' : 'Regular',
    };

    function groupRows(games) {
      const groups = {};
      games.forEach(g => {
        if (mode === 'pitching' && !g.pitching) return;
        (groups[KEYS[split](g)] = groups[KEYS[split](g)] || []).push(g);
      });
      return Object.entries(groups).map(([label, gs]) => {
        const r = mode === 'pitching'
          ? sumPitching(gs.map(g => ({ ...g.pitching, g: 1 })))
          : sumBatting(gs.map(g => ({ ...g, g: 1 })));
        r.label = label;
        // Start times sort by clock time, not alphabetically.
        r.labelKey = split === 'time' ? (timeMinutes(label) ?? 9999) : label;
        return r;
      });
    }

    function cell([k, , x], r) {
      let v;
      if (k === 'label') v = `<strong>${esc(r.label)}</strong>`;
      else if (RATE.has(k)) v = fmtAvg(r[k]);
      else if (k === 'era' || k === 'whip') v = fmtRate(r[k]);
      else if (k === 'ip') v = fmtOuts(r.outs);
      else v = num(r[k]);
      return `<td${x ? ' class="x"' : ''}>${v}</td>`;
    }

    function render() {
      const year = +document.getElementById('yearFilter').value || null;
      const team = document.getElementById('teamFilter').value;
      const minG = parseInt(document.getElementById('minGames').value, 10) || 1;
      const cols = MODES[mode].cols;
      const thead = document.querySelector('#splitsTable thead');
      thead.innerHTML = '<tr>' + cols.map(([k, l, x]) => `<th data-col="${k}"${x ? ' class="x"' : ''}>${l}</th>`).join('') + '</tr>';
      markSort(thead, state);
      let rows = groupRows(allGames.filter(g => (!year || g.year === year) && (!team || g.team === team)))
        .filter(r => r.g >= minG);
      sortRows(rows, state.col === 'label' ? { col: 'labelKey', dir: state.dir } : state);
      document.querySelector('#splitsTable tbody').innerHTML =
        rows.map(r => `<tr>${cols.map(c => cell(c, r)).join('')}</tr>`).join('')
        || `<tr><td colspan="${cols.length}" class="empty">No data</td></tr>`;
      document.getElementById('eraNote').hidden = mode !== 'pitching';
    }

    function press(group, btn) {
      document.querySelectorAll(`#${group} button`).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    }

    async function init() {
      setupMoreToggle();
      const results = await Promise.all(GAME_LOG_YEARS.map(y => tryLoadJSON(`data/personal/games/${y}.json`)));
      results.forEach((res, i) => {
        if (res.error) showError(`Could not load the ${GAME_LOG_YEARS[i]} game log (${res.error}).`);
        (res.data || []).forEach(g => allGames.push({ ...g, year: GAME_LOG_YEARS[i] }));
      });
      const add = (id, vals) => { const s = document.getElementById(id); vals.forEach(v => s.add(new Option(v, v))); };
      add('yearFilter', [...new Set(allGames.map(g => g.year))].sort((a, b) => b - a));
      add('teamFilter', [...new Set(allGames.map(g => g.team))].sort());

      document.getElementById('statMode').addEventListener('click', e => {
        const b = e.target.closest('button[data-mode]'); if (!b) return;
        mode = b.dataset.mode; press('statMode', b);
        state.col = MODES[mode].def; state.dir = ASC_FIRST.has(state.col) ? 'asc' : 'desc';
        render();
      });
      document.getElementById('splitTabs').addEventListener('click', e => {
        const b = e.target.closest('button[data-split]'); if (!b) return;
        split = b.dataset.split; press('splitTabs', b); render();
      });
      ['yearFilter', 'teamFilter'].forEach(id => document.getElementById(id).addEventListener('change', render));
      document.getElementById('minGames').addEventListener('input', render);
      bindSort(document.querySelector('#splitsTable thead'), state, render);
      render();
    }

    init();
  </script>
</body>
</html>
