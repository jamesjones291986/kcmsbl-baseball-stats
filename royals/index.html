<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Series - Baseball Stats</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../">⚾ Baseball Stats</a>
    <nav aria-label="Main">
      <a href="../">Hitting</a>
      <a href="../pitching.html">Pitching</a>
      <a href="../gamelogs/">Game Logs</a>
      <a href="../splits.html">Splits</a>
      <a href="./" aria-current="page">World Series</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">World Series</h1>

    <div class="tabs" role="tablist" aria-label="World Series views">
      <button type="button" role="tab" id="t-stats" aria-controls="tab-stats" aria-selected="true">My Stats</button>
      <button type="button" role="tab" id="t-team" aria-controls="tab-team" aria-selected="false" tabindex="-1">Team Stats</button>
      <button type="button" role="tab" id="t-games" aria-controls="tab-games" aria-selected="false" tabindex="-1">Game Log</button>
      <button type="button" class="chip tabs-aside" id="moreToggle" aria-pressed="false">More stats</button>
    </div>

    <div id="tab-stats" role="tabpanel" aria-labelledby="t-stats">
      <section aria-labelledby="myBatTitle">
        <div class="section-head"><h2 id="myBatTitle">Batting by Season</h2></div>
        <div class="table-wrap"><table id="battingTable"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      </section>
      <section aria-labelledby="myPitchTitle">
        <div class="section-head"><h2 id="myPitchTitle">Pitching by Season</h2></div>
        <div class="table-wrap"><table id="pitchingTable"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
        <p class="footnote">ERA is runs per 7 innings on every page.</p>
      </section>
    </div>

    <div id="tab-team" role="tabpanel" aria-labelledby="t-team" hidden>
      <div class="toolbar filters">
        <label>Season <select id="teamSeasonFilter"><option value="">Career</option></select></label>
        <div class="segmented" id="teamView" role="group" aria-label="Stat type">
          <button type="button" data-view="batting" aria-pressed="true">Batting</button>
          <button type="button" data-view="pitching" aria-pressed="false">Pitching</button>
        </div>
        <span class="meta" id="teamSeasonInfo"></span>
      </div>
      <div class="table-wrap"><table id="teamStatsTable"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    </div>

    <div id="tab-games" role="tabpanel" aria-labelledby="t-games" hidden>
      <div class="toolbar filters">
        <label>Season <select id="seasonFilter"><option value="">All seasons</option></select></label>
        <label>Phase <select id="phaseFilter"><option value="">All phases</option></select></label>
        <span class="meta" id="recordSummary"></span>
      </div>
      <div class="table-wrap"><table id="gamelogTable"><thead><tr>
        <th>Date</th><th>Phase</th><th>Opponent</th><th>Result</th><th>Venue</th>
      </tr></thead><tbody></tbody></table></div>
      <div id="boxScore" class="box-score" tabindex="-1"></div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/stats.js"></script>
  <script src="ws-common.js"></script>
  <script>
    let allSeasons = [];
    const RATE = new Set(['avg', 'obp', 'slg', 'ops']);

    function th(cols) { return '<tr>' + cols.map(([k, l, x]) => `<th data-col="${k}"${x ? ' class="x"' : ''}>${l}</th>`).join('') + '</tr>'; }
    function td(v, x) { return `<td${x ? ' class="x"' : ''}>${v}</td>`; }
    function statCell([k, , x], r, season) {
      if (k === 'name') return td(r.isTotal ? esc(r.name) : playerLink(r.name, season), x);
      if (['year', 'team', 'division'].includes(k)) return td(esc(r[k] ?? ''), x);
      if (k === 'note') return `<td class="note">${esc(r.note || '')}</td>`;
      if (RATE.has(k)) return td(fmtAvg(r[k]), x);
      if (k === 'era' || k === 'whip') return td(fmtRate(r[k]), x);
      if (k === 'ip') return td(fmtOuts(r.outs), x);
      return td(num(r[k]), x);
    }

    // ---------- Tabs ----------
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    function selectTab(tab, focus) {
      tabs.forEach(t => {
        const on = t === tab;
        t.setAttribute('aria-selected', String(on));
        t.tabIndex = on ? 0 : -1;
        document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
      });
      if (focus) tab.focus();
    }
    tabs.forEach((t, i) => {
      t.addEventListener('click', () => selectTab(t));
      t.addEventListener('keydown', e => {
        const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (d) selectTab(tabs[(i + d + tabs.length) % tabs.length], true);
      });
    });

    async function init() {
      setupMoreToggle();
      let personal;
      try { [personal, allSeasons] = await Promise.all([loadJSON('../data/royals/seasons.json'), loadSeasons()]); }
      catch (e) { showError('Could not load World Series stats: ' + e.message); return; }
      renderMyBatting(personal.batting);
      renderMyPitching(personal.pitching);
      setupTeamStats();
      setupGameLog();
      openLinkedBox();
    }

    // ---------- My Stats ----------
    const MY_BAT = [['year', 'Year'], ['team', 'Team'], ['division', 'Division', 1], ['age', 'Age', 1], ['g', 'G'],
      ['ab', 'AB'], ['r', 'R'], ['h', 'H'], ['2b', '2B', 1], ['3b', '3B', 1], ['hr', 'HR'], ['rbi', 'RBI'],
      ['bb', 'BB'], ['k', 'K'], ['hb', 'HBP', 1], ['sb', 'SB', 1], ['avg', 'AVG'], ['obp', 'OBP'], ['slg', 'SLG'],
      ['ops', 'OPS'], ['w', 'W', 1], ['l', 'L', 1], ['note', 'Note']];
    const MY_PITCH = [['year', 'Year'], ['team', 'Team'], ['age', 'Age', 1], ['g', 'G'], ['gs', 'GS'], ['w', 'W'],
      ['l', 'L'], ['s', 'SV'], ['ip', 'IP'], ['h', 'H'], ['r', 'R'], ['er', 'ER'], ['bb', 'BB'], ['k', 'K'],
      ['era', 'ERA'], ['whip', 'WHIP'], ['cg', 'CG', 1], ['sho', 'SHO', 1]];

    function renderMyBatting(rows) {
      const data = rows.map(r => withRates({ ...r }));
      document.querySelector('#battingTable thead').innerHTML = th(MY_BAT);
      document.querySelector('#battingTable tbody').innerHTML = data.map(r =>
        `<tr${isChamp(r.note) ? ' class="champ-row"' : ''}>${MY_BAT.map(c => statCell(c, r)).join('')}</tr>`).join('');
      // Playing for two teams in one World Series is still one World Series.
      const t = sumBatting(data, { year: 'Career', team: `${new Set(data.map(r => r.year)).size} World Series` });
      document.querySelector('#battingTable tfoot').innerHTML =
        `<tr class="total-row">${MY_BAT.map(c => ['division', 'age', 'note'].includes(c[0]) ? td('', c[2]) : statCell(c, t)).join('')}</tr>`;
    }

    function renderMyPitching(rows) {
      const data = rows.map(r => sumPitching([r], { year: r.year, team: r.team, age: r.age }));
      document.querySelector('#pitchingTable thead').innerHTML = th(MY_PITCH);
      document.querySelector('#pitchingTable tbody').innerHTML =
        data.map(r => `<tr>${MY_PITCH.map(c => statCell(c, r)).join('')}</tr>`).join('');
      const t = sumPitching(data, { year: 'Career', team: '' });
      document.querySelector('#pitchingTable tfoot').innerHTML =
        `<tr class="total-row">${MY_PITCH.map(c => c[0] === 'age' ? td('', 1) : statCell(c, t)).join('')}</tr>`;
    }

    // ---------- Team Stats ----------
    const TEAM_BAT = [['name', 'Name'], ['g', 'G'], ['ab', 'AB'], ['r', 'R'], ['h', 'H'], ['2b', '2B', 1], ['3b', '3B', 1],
      ['hr', 'HR'], ['rbi', 'RBI'], ['bb', 'BB'], ['k', 'K'], ['sb', 'SB', 1], ['hb', 'HBP', 1],
      ['avg', 'AVG'], ['obp', 'OBP'], ['slg', 'SLG'], ['ops', 'OPS']];
    const TEAM_PITCH = [['name', 'Name'], ['g', 'G'], ['w', 'W'], ['l', 'L'], ['s', 'SV'], ['ip', 'IP'], ['h', 'H'],
      ['r', 'R'], ['er', 'ER'], ['bb', 'BB'], ['k', 'K'], ['era', 'ERA'], ['whip', 'WHIP']];
    let teamView = 'batting';
    const teamSort = { col: 'h', dir: 'desc' };

    function setupTeamStats() {
      const sel = document.getElementById('teamSeasonFilter');
      allSeasons.forEach(s => sel.add(new Option(`${s.season} — ${s.team} (${s.division})`, s.season)));
      sel.addEventListener('change', renderTeamStats);
      document.getElementById('teamView').addEventListener('click', e => {
        const b = e.target.closest('button[data-view]'); if (!b) return;
        teamView = b.dataset.view;
        document.querySelectorAll('#teamView button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        teamSort.col = teamView === 'batting' ? 'h' : 'ip'; teamSort.dir = 'desc';
        renderTeamStats();
      });
      bindSort(document.querySelector('#teamStatsTable thead'), teamSort, renderTeamStats);
      renderTeamStats();
    }

    function renderTeamStats() {
      const season = document.getElementById('teamSeasonFilter').value;
      const seasons = season ? allSeasons.filter(s => s.season === +season) : allSeasons;
      document.getElementById('teamSeasonInfo').textContent = season && seasons.length
        ? `${seasons[0].team} — ${seasons[0].division}` : 'All seasons';
      const players = {};
      seasons.forEach(s => s.games.forEach(g => {
        const side = ourSide(g);
        if (teamView === 'batting') {
          (g.batting[side] || []).forEach(b => {
            const p = players[b.name] = players[b.name] || [];
            p.push({ ...b, g: 1, sb: noteCount(g, 'sb', b.name), hbp: noteCount(g, 'hbp', b.name), sf: noteCount(g, 'sf', b.name) });
          });
        } else {
          (g.pitching[side] || []).forEach(p => {
            (players[p.name] = players[p.name] || []).push({ ...p, g: 1,
              w: p.decision === 'W' ? 1 : 0, l: p.decision === 'L' ? 1 : 0, s: p.decision === 'S' ? 1 : 0 });
          });
        }
      }));
      const cols = teamView === 'batting' ? TEAM_BAT : TEAM_PITCH;
      const agg = lines => teamView === 'batting'
        ? sumBatting(lines.map(l => ({ ...l, hb: l.hbp })))
        : sumPitching(lines);
      const rows = Object.entries(players).map(([name, lines]) => ({ ...agg(lines), name }));
      const thead = document.querySelector('#teamStatsTable thead');
      thead.innerHTML = th(cols); markSort(thead, teamSort);
      document.querySelector('#teamStatsTable tbody').innerHTML =
        sortRows(rows, teamSort).map(r => `<tr>${cols.map(c => statCell(c, r, season)).join('')}</tr>`).join('');
      const total = { ...agg(Object.values(players).flat()), name: 'Team', isTotal: true };
      total.g = new Set(seasons.flatMap(s => s.games.map(g => g.date + g.time))).size;
      document.querySelector('#teamStatsTable tfoot').innerHTML =
        `<tr class="total-row">${cols.map(c => statCell(c, total)).join('')}</tr>`;
    }

    // ---------- Game Log + box score ----------
    function setupGameLog() {
      const sel = document.getElementById('seasonFilter');
      allSeasons.forEach(s => sel.add(new Option(`${s.season} — ${s.division}`, s.season)));
      sel.addEventListener('change', () => { renderGameLog(); clearBox(); });
      document.getElementById('phaseFilter').addEventListener('change', () => { renderGameLog(); clearBox(); });
      document.querySelector('#gamelogTable tbody').addEventListener('click', e => {
        const a = e.target.closest('a.box-link') || e.target.closest('tr')?.querySelector('a.box-link');
        if (!a) return;
        e.preventDefault();
        openBox(+a.dataset.season, a.dataset.date, a.dataset.time);
      });
      renderGameLog();
    }

    function renderGameLog() {
      const season = +document.getElementById('seasonFilter').value || null;
      let rows = [];
      allSeasons.forEach(s => {
        if (season && s.season !== season) return;
        s.games.forEach(g => rows.push({ ...g, opponent: opponentOf(g), seasonYear: s.season }));
      });
      const pf = document.getElementById('phaseFilter'), keep = pf.value;
      pf.innerHTML = '<option value="">All phases</option>';
      [...new Set(rows.map(r => r.phase).filter(Boolean))].forEach(p => pf.add(new Option(p, p)));
      pf.value = keep;
      if (pf.value) rows = rows.filter(r => r.phase === pf.value);
      rows.sort((a, b) => gameKey(a).localeCompare(gameKey(b)));
      const w = rows.filter(r => r.result === 'W').length, l = rows.filter(r => r.result === 'L').length;
      document.getElementById('recordSummary').textContent = `${w}-${l} in ${rows.length} games`;
      document.querySelector('#gamelogTable tbody').innerHTML = rows.map(g => `<tr class="clickable">
          <td><a class="box-link" href="${esc(boxUrl(g.seasonYear, g.date, g.time))}" data-season="${g.seasonYear}"
            data-date="${esc(g.date)}" data-time="${esc(g.time)}">${esc(g.date)}</a></td>
          <td>${esc(g.phase || '')}</td><td>${esc(g.opponent)}</td>
          <td>${resultHtml(`${g.result} ${g.score}`)}</td><td>${esc(g.venue)}</td></tr>`).join('');
    }

    function clearBox() { document.getElementById('boxScore').innerHTML = ''; }

    function openBox(season, date, time) {
      if (!showBox(season, date, time)) return;
      history.replaceState(null, '', boxUrl(season, date, time));
      const box = document.getElementById('boxScore');
      box.scrollIntoView({ behavior: 'smooth' });
      box.focus({ preventScroll: true });
    }

    // index.html?season=2026&date=2026-10-21&time=9:00am opens that box score; the
    // player page links back to games this way.
    function openLinkedBox() {
      const q = new URLSearchParams(location.search);
      const season = +q.get('season'), date = q.get('date'), time = q.get('time');
      if (!season || !date) return;
      selectTab(document.getElementById('t-games'));
      document.getElementById('seasonFilter').value = season;
      renderGameLog();
      openBox(season, date, time);
    }

    function showBox(year, date, time) {
      const season = allSeasons.find(s => s.season === year);
      const game = season && season.games.find(g => g.date === date && g.time === time);
      if (!game) return false;
      const us = ourSide(game);
      let html = `<h3>${esc(game.away)} @ ${esc(game.home)}</h3>
        <p class="meta">${esc(game.date)} · ${esc(game.time)} · ${esc(game.venue)}${game.phase ? ' · ' + esc(game.phase) : ''}</p>`;

      const innings = Math.max(game.linescore.away.length, game.linescore.home.length);
      html += '<div class="table-wrap"><table class="linescore"><thead><tr><th>Team</th>';
      for (let i = 1; i <= innings; i++) html += `<th>${i}</th>`;
      html += '<th>R</th><th>H</th></tr></thead><tbody>';
      let lineRuns = {};
      ['away', 'home'].forEach(key => {
        const ls = game.linescore[key], batters = game.batting[key] || [];
        lineRuns[key] = ls.reduce((a, b) => a + b, 0);
        html += `<tr${key === us ? ' class="us"' : ''}><td>${esc(game[key])}</td>`
          + Array.from({ length: innings }, (_, i) => `<td>${ls[i] ?? ''}</td>`).join('')
          + `<td><strong>${lineRuns[key]}</strong></td><td>${batters.length ? batters.reduce((a, b) => a + (b.h || 0), 0) : '-'}</td></tr>`;
      });
      html += '</tbody></table></div>';
      const [ours, theirs] = String(game.score).split('-').map(Number);
      if (lineRuns[us] !== ours || lineRuns[us === 'home' ? 'away' : 'home'] !== theirs)
        html += `<p class="footnote">Inning-by-inning scoring is incomplete for this game; the final was ${esc(game.score)}.</p>`;

      const batters = game.batting[us] || [];
      if (batters.length) {
        html += '<h4>Batting</h4><div class="table-wrap"><table><thead><tr><th>Name</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th></tr></thead><tbody>';
        batters.forEach(b => {
          // A batter with sub_for entered in that lineup spot, so he's indented under the man he replaced.
          const name = b.sub_for
            ? `<span class="sub" title="In for ${esc(b.sub_for)}">↳ ${playerLink(b.name, year)}</span>` : playerLink(b.name, year);
          html += `<tr><td>${name}</td>${['ab', 'r', 'h', 'rbi', 'bb', 'k'].map(k => `<td>${num(b[k])}</td>`).join('')}</tr>`;
        });
        const t = batters.reduce((t, b) => { ['ab', 'r', 'h', 'rbi', 'bb', 'k'].forEach(k => t[k] += b[k] || 0); return t; }, { ab: 0, r: 0, h: 0, rbi: 0, bb: 0, k: 0 });
        html += `</tbody><tfoot><tr class="total-row"><td>Totals</td>${['ab', 'r', 'h', 'rbi', 'bb', 'k'].map(k => `<td>${t[k]}</td>`).join('')}</tr></tfoot></table></div>`;
      }
      const pitchers = game.pitching[us] || [];
      if (pitchers.length) {
        html += '<h4>Pitching</h4><div class="table-wrap"><table><thead><tr><th>Name</th><th>Dec</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th></tr></thead><tbody>';
        pitchers.forEach(p => {
          html += `<tr><td>${playerLink(p.name, year)}</td><td>${esc(p.decision || '')}</td><td>${fmtOuts(ipToOuts(p.ip))}</td>`
            + ['h', 'r', 'er', 'bb', 'k'].map(k => `<td>${num(p[k])}</td>`).join('') + '</tr>';
        });
        html += '</tbody></table></div>';
      }
      const LABELS = { '2b': '2B', '3b': '3B', hr: 'HR', sb: 'SB', cs: 'CS', errors: 'E', hbp: 'HBP', sh: 'SH', sf: 'SF' };
      const parts = Object.entries(LABELS).filter(([k]) => game.notes?.[k]?.length)
        .map(([k, l]) => `<span><b>${l}:</b> ${game.notes[k].map(esc).join(', ')}</span>`);
      if (parts.length) html += `<p class="box-notes">${parts.join('')}</p>`;
      document.getElementById('boxScore').innerHTML = html;
      return true;
    }

    init();
  </script>
</body>
</html>
