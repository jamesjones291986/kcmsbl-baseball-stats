<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player - World Series - Baseball Stats</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="player-page">
  <header class="site-header">
    <a class="brand" href="../">⚾ Baseball Stats</a>
    <nav aria-label="Main">
      <a href="../">Hitting</a>
      <a href="../pitching.html">Pitching</a>
      <a href="../gamelogs/">Game Logs</a>
      <a href="../splits.html">Splits</a>
      <a href="./" aria-current="page">World Series</a>
    </nav>
  </header>

  <main>
    <p class="breadcrumb"><a href="./">World Series</a> / Player</p>
    <h1 class="page-title" id="playerName">Player</h1>

    <div class="toolbar filters">
      <label>Season <select id="seasonFilter"><option value="">Career</option></select></label>
      <span class="meta" id="summary"></span>
      <button type="button" class="chip" id="moreToggle" aria-pressed="false">More stats</button>
    </div>

    <section id="battingSection" aria-labelledby="batTitle" hidden>
      <div class="section-head"><h2 id="batTitle">Batting</h2></div>
      <div class="hero" id="battingCards"></div>
      <div class="table-wrap"><table id="battingTable"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
    </section>

    <section id="pitchingSection" aria-labelledby="pitchTitle" hidden>
      <div class="section-head"><h2 id="pitchTitle">Pitching</h2></div>
      <div class="hero" id="pitchingCards"></div>
      <div class="table-wrap"><table id="pitchingTable"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      <p class="footnote">ERA is runs per 7 innings.</p>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/stats.js"></script>
  <script src="ws-common.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const NAME = params.get('name') || '';
    let seasons = [], batting = [], pitching = [];

    const B_COLS = [['date', 'Date'], ['opp', 'Opponent'], ['result', 'Result'], ['ab', 'AB'], ['r', 'R'], ['h', 'H'],
      ['2b', '2B', 1], ['3b', '3B', 1], ['hr', 'HR'], ['rbi', 'RBI'], ['bb', 'BB'], ['k', 'K'],
      ['hb', 'HBP', 1], ['sb', 'SB', 1], ['cs', 'CS', 1], ['sac', 'SAC', 1]];
    const P_COLS = [['date', 'Date'], ['opp', 'Opponent'], ['result', 'Result'], ['dec', 'Dec'], ['ip', 'IP'],
      ['h', 'H'], ['r', 'R'], ['er', 'ER'], ['bb', 'BB'], ['k', 'K'], ['hbp', 'HB', 1]];

    function th(cols) { return '<tr>' + cols.map(([k, l, x]) => `<th${x ? ' class="x"' : ''}>${l}</th>`).join('') + '</tr>'; }
    function td(v, x) { return `<td${x ? ' class="x"' : ''}>${v}</td>`; }

    async function init() {
      setupMoreToggle();
      document.getElementById('playerName').textContent = NAME || 'Player';
      document.title = (NAME ? NAME + ' - ' : '') + 'World Series - Baseball Stats';
      seasons = await loadSeasons();

      seasons.forEach(s => s.games.forEach(g => {
        const side = ourSide(g), base = { season: s.season, team: s.team, g };
        const b = (g.batting[side] || []).find(x => x.name === NAME);
        if (b) batting.push({ ...base, b, hb: noteCount(g, 'hbp', NAME), sb: noteCount(g, 'sb', NAME),
          cs: noteCount(g, 'cs', NAME), sf: noteCount(g, 'sf', NAME), sh: noteCount(g, 'sh', NAME) });
        const p = (g.pitching[side] || []).find(x => x.name === NAME);
        // 2026+ store hit batters on the pitching line; earlier years used a note.
        if (p) pitching.push({ ...base, p, hbp: p.hbp != null ? p.hbp : noteCount(g, 'hb_pitching', NAME) });
      }));
      const byDate = (a, b) => gameKey(a.g).localeCompare(gameKey(b.g));
      batting.sort(byDate); pitching.sort(byDate);

      const years = [...new Set([...batting, ...pitching].map(x => x.season))].sort();
      const sel = document.getElementById('seasonFilter');
      years.forEach(y => { const s = seasons.find(x => x.season === y); sel.add(new Option(`${y} — ${s.team} (${s.division})`, y)); });
      if (years.includes(+params.get('season'))) sel.value = params.get('season');
      sel.addEventListener('change', () => {
        const q = new URLSearchParams(location.search);
        sel.value ? q.set('season', sel.value) : q.delete('season');
        history.replaceState(null, '', '?' + q.toString());
        render();
      });
      render();
    }

    function gameCells(x, sub) {
      const g = x.g;
      return td(`<a class="box-link" href="${esc(boxUrl(x.season, g.date, g.time))}" title="Open box score">${esc(g.date)}</a>`)
        + td(`${ourSide(g) === 'home' ? 'vs' : '@'} ${esc(opponentOf(g))}${sub || ''}`)
        + td(resultHtml(`${g.result} ${g.score}`));
    }
    function cards(id, list) {
      document.getElementById(id).innerHTML = list.map(([l, v]) =>
        `<div class="stat-card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');
    }

    function render() {
      const season = +document.getElementById('seasonFilter').value || null;
      const inSeason = x => !season || x.season === season;
      const bats = batting.filter(inSeason), pits = pitching.filter(inSeason);
      const summary = document.getElementById('summary');
      if (!bats.length && !pits.length) {
        summary.textContent = `No World Series games found for “${NAME}”.`;
      } else {
        const games = new Map();
        [...bats, ...pits].forEach(x => games.set(x.season + gameKey(x.g), x.g));
        const w = [...games.values()].filter(g => g.result === 'W').length;
        const l = [...games.values()].filter(g => g.result === 'L').length;
        const teams = [...new Set([...bats, ...pits].map(x => x.team))].join(' / ');
        summary.textContent = `${teams} · ${games.size} games · team ${w}-${l}`;
      }
      renderBatting(bats);
      renderPitching(pits);
    }

    function renderBatting(rows) {
      document.getElementById('battingSection').hidden = !rows.length;
      if (!rows.length) return;
      const lines = rows.map(x => ({ ...x.b, g: 1, hb: x.hb, sb: x.sb, sf: x.sf, s: x.sf + x.sh, cs: x.cs }));
      const t = sumBatting(lines); t.cs = lines.reduce((n, l) => n + l.cs, 0);
      document.querySelector('#battingTable thead').innerHTML = th(B_COLS);
      document.querySelector('#battingTable tbody').innerHTML = rows.map((x, i) => {
        const l = lines[i];
        const sub = x.b.sub_for ? ` <span class="tag" title="In for ${esc(x.b.sub_for)}">sub</span>` : '';
        return '<tr>' + gameCells(x, sub) + B_COLS.slice(3).map(([k, , xx]) => td(num(k === 'sac' ? l.s : l[k] || 0), xx)).join('') + '</tr>';
      }).join('');
      document.querySelector('#battingTable tfoot').innerHTML = `<tr class="total-row">${td('Totals')}${td(`${rows.length} games`)}${td('')}`
        + B_COLS.slice(3).map(([k, , xx]) => td(num(k === 'sac' ? t.s : t[k]), xx)).join('') + '</tr>';
      cards('battingCards', [['G', rows.length], ['AVG', fmtAvg(t.avg)], ['OBP', fmtAvg(t.obp)], ['SLG', fmtAvg(t.slg)],
        ['H', t.h], ['RBI', t.rbi], ['Runs', t.r]]);
    }

    function renderPitching(rows) {
      document.getElementById('pitchingSection').hidden = !rows.length;
      if (!rows.length) return;
      const lines = rows.map(x => ({ ...x.p, g: 1, w: x.p.decision === 'W' ? 1 : 0, l: x.p.decision === 'L' ? 1 : 0, s: x.p.decision === 'S' ? 1 : 0 }));
      const t = sumPitching(lines); const hbp = rows.reduce((n, x) => n + x.hbp, 0);
      document.querySelector('#pitchingTable thead').innerHTML = th(P_COLS);
      document.querySelector('#pitchingTable tbody').innerHTML = rows.map(x => '<tr>' + gameCells(x)
        + td(esc(x.p.decision || '')) + td(fmtOuts(ipToOuts(x.p.ip)))
        + ['h', 'r', 'er', 'bb', 'k'].map(k => td(num(x.p[k] || 0))).join('') + td(num(x.hbp), 1) + '</tr>').join('');
      document.querySelector('#pitchingTable tfoot').innerHTML = `<tr class="total-row">${td('Totals')}${td(`${rows.length} games`)}${td('')}`
        + td(`${t.w}-${t.l}`) + td(fmtOuts(t.outs)) + ['h', 'r', 'er', 'bb', 'k'].map(k => td(t[k])).join('') + td(hbp, 1) + '</tr>';
      cards('pitchingCards', [['G', rows.length], ['W-L', `${t.w}-${t.l}`], ['ERA', fmtRate(t.era)],
        ['WHIP', fmtRate(t.whip)], ['IP', fmtOuts(t.outs)], ['K', t.k], ['BB', t.bb]]);
    }

    init();
  </script>
</body>
</html>
