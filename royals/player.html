<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player - World Series - Baseball Stats</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .game-filters { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .game-filters select {
      background: #374151; color: #e5e7eb; border: 1px solid #4b5563;
      padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem;
    }
    .game-filters label { font-weight: 600; font-size: 0.85rem; }
    .record-summary { color: #9ca3af; font-size: 0.85rem; margin-bottom: 1rem; }
    .record-summary span { color: #e94560; font-weight: 700; }
    .sub-tag { color: #9ca3af; font-size: 0.75rem; }
    td a.box-link { color: inherit; text-decoration: none; border-bottom: 1px dotted #6b7280; }
    td a.box-link:hover { color: #e94560; border-bottom-color: #e94560; }
    .empty { color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <h1 id="playerName">👑 Player</h1>
    <nav>
      <a href="index.html">World Series</a>
      <a href="../">Personal Stats</a>
    </nav>
  </header>

  <main>
    <section>
      <div class="game-filters">
        <label>Season:
          <select id="seasonFilter"><option value="">Career</option></select>
        </label>
      </div>
      <div class="record-summary" id="summary"></div>
    </section>

    <section id="battingSection">
      <h2>Batting Game Log</h2>
      <div id="battingCards" class="totals-card-grid"></div>
      <div class="table-wrap">
        <table id="battingTable">
          <thead><tr>
            <th>Date</th><th style="text-align:left">Opponent</th><th>Result</th>
            <th>AB</th><th>R</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th>
            <th>BB</th><th>K</th><th>HBP</th><th>SB</th><th>CS</th><th>SAC</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="pitchingSection">
      <h2>Pitching Game Log</h2>
      <div id="pitchingCards" class="totals-card-grid"></div>
      <div class="table-wrap">
        <table id="pitchingTable">
          <thead><tr>
            <th>Date</th><th style="text-align:left">Opponent</th><th>Result</th><th>Dec</th>
            <th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>HB</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="ws-common.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const NAME = params.get('name') || '';
    let seasons = [];
    let batting = [];   // one entry per game he batted in
    let pitching = [];  // one entry per game he pitched in

    async function init() {
      document.getElementById('playerName').textContent = '👑 ' + (NAME || 'Player');
      document.title = NAME + ' - World Series - Baseball Stats';
      seasons = await loadSeasons();

      seasons.forEach(s => s.games.forEach(g => {
        const side = ourSide(g);
        const game = { season: s.season, team: s.team, g };
        const b = (g.batting[side] || []).find(x => x.name === NAME);
        if (b) batting.push({ ...game, b,
          hbp: noteCount(g, 'hbp', NAME), sb: noteCount(g, 'sb', NAME), cs: noteCount(g, 'cs', NAME),
          sf: noteCount(g, 'sf', NAME), sh: noteCount(g, 'sh', NAME) });
        const p = (g.pitching[side] || []).find(x => x.name === NAME);
        if (p) pitching.push({ ...game, p,
          // 2026+ store hit batters on the pitching line; earlier years used a note.
          hb: p.hbp != null ? p.hbp : noteCount(g, 'hb_pitching', NAME) });
      }));

      const byDate = (a, b) => gameKey(a.g).localeCompare(gameKey(b.g));
      batting.sort(byDate); pitching.sort(byDate);

      const years = [...new Set([...batting, ...pitching].map(x => x.season))].sort();
      const sel = document.getElementById('seasonFilter');
      years.forEach(y => {
        const s = seasons.find(x => x.season === y);
        const o = document.createElement('option');
        o.value = y; o.textContent = `${y} — ${s.team} (${s.division})`;
        sel.appendChild(o);
      });
      const wanted = params.get('season');
      if (wanted && years.includes(+wanted)) sel.value = wanted;
      sel.addEventListener('change', () => {
        const q = new URLSearchParams(location.search);
        sel.value ? q.set('season', sel.value) : q.delete('season');
        history.replaceState(null, '', '?' + q.toString());
        render();
      });
      render();
    }

    function gameCells(x) {
      const g = x.g;
      const at = ourSide(g) === 'home' ? 'vs' : '@';
      const color = g.result === 'W' ? '#4caf50' : g.result === 'L' ? '#e94560' : 'inherit';
      return `<td><a class="box-link" href="${boxUrl(x.season, g.date, g.time)}" title="Open box score">${g.date}</a></td>
        <td style="text-align:left">${at} ${opponentOf(g)}</td>
        <td style="color:${color}">${g.result} ${g.score}</td>`;
    }

    function cards(el, list) {
      document.getElementById(el).innerHTML = list.map(([l, v]) =>
        `<div class="stat-card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');
    }

    function render() {
      const season = +document.getElementById('seasonFilter').value || null;
      const inSeason = x => !season || x.season === season;
      const bats = batting.filter(inSeason), pits = pitching.filter(inSeason);

      if (!bats.length && !pits.length) {
        document.getElementById('summary').innerHTML =
          `<span class="empty">No World Series games found for “${NAME}”.</span>`;
      } else {
        const games = new Map();
        [...bats, ...pits].forEach(x => games.set(x.season + x.g.date + x.g.time, x.g));
        const w = [...games.values()].filter(g => g.result === 'W').length;
        const l = [...games.values()].filter(g => g.result === 'L').length;
        const teams = [...new Set([...bats, ...pits].map(x => x.team))].join(' / ');
        document.getElementById('summary').innerHTML =
          `<span>${season ? season : 'Career'}</span> — ${teams} — ${games.size} games, team ${w}-${l}`;
      }
      renderBatting(bats, !!season);
      renderPitching(pits, !!season);
    }

    function renderBatting(rows, oneSeason) {
      document.getElementById('battingSection').style.display = rows.length ? '' : 'none';
      if (!rows.length) return;
      const t = { ab:0, r:0, h:0, '2b':0, '3b':0, hr:0, rbi:0, bb:0, k:0, hbp:0, sb:0, cs:0, sf:0, sh:0 };
      const tbody = document.querySelector('#battingTable tbody');
      tbody.innerHTML = rows.map(x => {
        const b = x.b;
        ['ab','r','h','2b','3b','hr','rbi','bb','k'].forEach(k => t[k] += b[k] || 0);
        ['hbp','sb','cs','sf','sh'].forEach(k => t[k] += x[k]);
        const sub = b.sub_for ? ` <span class="sub-tag" title="in for ${b.sub_for}">(sub)</span>` : '';
        return `<tr>${gameCells(x).replace('</td>', sub + '</td>')}
          <td>${b.ab}</td><td>${b.r}</td><td>${b.h}</td><td>${b['2b']||0}</td><td>${b['3b']||0}</td><td>${b.hr||0}</td>
          <td>${b.rbi}</td><td>${b.bb}</td><td>${b.k}</td><td>${x.hbp}</td><td>${x.sb}</td><td>${x.cs}</td>
          <td>${x.sf + x.sh}</td></tr>`;
      }).join('') + `<tr class="total-row"><td style="text-align:left" colspan="3">Totals (${rows.length} G)</td>
          <td>${t.ab}</td><td>${t.r}</td><td>${t.h}</td><td>${t['2b']}</td><td>${t['3b']}</td><td>${t.hr}</td>
          <td>${t.rbi}</td><td>${t.bb}</td><td>${t.k}</td><td>${t.hbp}</td><td>${t.sb}</td><td>${t.cs}</td>
          <td>${t.sf + t.sh}</td></tr>`;
      const avg = t.ab ? t.h / t.ab : 0, o = obp(t), s = slg(t);
      cards('battingCards', [['G', rows.length], ['AVG', fmt3(avg)], ['OBP', fmt3(o)], ['SLG', fmt3(s)],
        ['OPS', fmt3(o + s)], ['H', t.h], ['R', t.r], ['RBI', t.rbi], ['BB', t.bb], ['K', t.k]]);
    }

    function renderPitching(rows, oneSeason) {
      document.getElementById('pitchingSection').style.display = rows.length ? '' : 'none';
      if (!rows.length) return;
      const t = { outs:0, h:0, r:0, er:0, bb:0, k:0, hb:0, w:0, l:0, s:0 };
      const tbody = document.querySelector('#pitchingTable tbody');
      tbody.innerHTML = rows.map(x => {
        const p = x.p;
        t.outs += ipToOuts(p.ip || 0);
        ['h','r','er','bb','k'].forEach(k => t[k] += p[k] || 0);
        t.hb += x.hb;
        if (p.decision === 'W') t.w++;
        if (p.decision === 'L') t.l++;
        if (p.decision === 'S') t.s++;
        return `<tr>${gameCells(x)}<td>${p.decision || ''}</td>
          <td>${p.ip}</td><td>${p.h}</td><td>${p.r}</td><td>${p.er}</td><td>${p.bb}</td><td>${p.k}</td><td>${x.hb}</td></tr>`;
      }).join('') + `<tr class="total-row"><td style="text-align:left" colspan="4">Totals (${rows.length} G)</td>
          <td>${outsToIp(t.outs).toFixed(1)}</td><td>${t.h}</td><td>${t.r}</td><td>${t.er}</td><td>${t.bb}</td>
          <td>${t.k}</td><td>${t.hb}</td></tr>`;
      const inn = t.outs / 3;
      cards('pitchingCards', [['G', rows.length], ['ERA', fmtRate(rate(t.er * 9, inn))],
        ['WHIP', fmtRate(rate(t.bb + t.h, inn))], ['IP', outsToIp(t.outs).toFixed(1)],
        ['W-L', `${t.w}-${t.l}`], ['SV', t.s], ['K', t.k], ['BB', t.bb]]);
    }

    init();
  </script>
</body>
</html>
