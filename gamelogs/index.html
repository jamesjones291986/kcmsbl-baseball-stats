<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Logs - Baseball Stats</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../">⚾ Baseball Stats</a>
    <nav aria-label="Main">
      <a href="../">Hitting</a>
      <a href="../pitching.html">Pitching</a>
      <a href="./" aria-current="page">Game Logs</a>
      <a href="../splits.html">Splits</a>
      <a href="../royals/">World Series</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Game Logs</h1>

    <div class="toolbar filters">
      <label>Year <select id="yearFilter"><option value="">All</option></select></label>
      <label>Team <select id="teamFilter"><option value="">All</option></select></label>
      <label>Opponent <select id="opponentFilter"><option value="">All</option></select></label>
      <label>Field <select id="fieldFilter"><option value="">All</option></select></label>
      <button type="button" class="chip" id="moreToggle" aria-pressed="false">More stats</button>
    </div>

    <section aria-labelledby="battingTitle">
      <div class="section-head"><h2 id="battingTitle">Batting</h2><span class="meta" id="battingMeta"></span></div>
      <div class="table-wrap">
        <table id="gamelogTable"><thead></thead><tbody></tbody><tfoot></tfoot></table>
      </div>
    </section>

    <section id="pitchingLog" aria-labelledby="pitchingTitle" hidden>
      <div class="section-head"><h2 id="pitchingTitle">Pitching</h2><span class="meta" id="pitchingMeta"></span></div>
      <div class="table-wrap">
        <table id="pitchingLogTable"><thead></thead><tbody></tbody><tfoot></tfoot></table>
      </div>
      <p class="footnote">ERA is runs per 7 innings.</p>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/stats.js"></script>
  <script>
    const B_COLS = [
      ['when', 'Date'], ['team', 'Team'], ['opponent', 'Opponent'], ['field', 'Field', 1], ['result', 'Result'],
      ['ab', 'AB'], ['r', 'R'], ['h', 'H'], ['2b', '2B', 1], ['3b', '3B', 1], ['hr', 'HR'], ['rbi', 'RBI'],
      ['bb', 'BB'], ['k', 'K'], ['hb', 'HBP', 1], ['sb', 'SB', 1], ['s', 'SAC', 1],
      ['avg', 'AVG'], ['obp', 'OBP'], ['slg', 'SLG'], ['ops', 'OPS'],
    ];
    const P_COLS = [
      ['when', 'Date'], ['team', 'Team'], ['opponent', 'Opponent'], ['result', 'Result'],
      ['ip', 'IP'], ['h', 'H'], ['r', 'R'], ['er', 'ER'], ['bb', 'BB'], ['k', 'K'], ['era', 'ERA'], ['whip', 'WHIP'],
    ];
    const RATE = new Set(['avg', 'obp', 'slg', 'ops']);
    const bSort = { col: 'when', dir: 'desc' }, pSort = { col: 'when', dir: 'desc' };
    let allGames = [];

    function head(cols) {
      return '<tr>' + cols.map(([k, l, x]) => `<th data-col="${k}"${x ? ' class="x"' : ''}>${l}</th>`).join('') + '</tr>';
    }
    function td(k, v, x) { return `<td${x ? ' class="x"' : ''}>${v}</td>`; }
    function bCell([k, , x], r) {
      if (k === 'when') return td(k, esc(r.date), x);
      if (k === 'result') return td(k, resultHtml(r.result), x);
      if (['team', 'opponent', 'field'].includes(k)) return td(k, esc(r[k] || ''), x);
      if (RATE.has(k)) return td(k, fmtAvg(r[k]), x);
      return td(k, num(r[k]), x);
    }
    function pCell([k, , x], r) {
      if (k === 'ip') return td(k, fmtOuts(r.outs), x);
      if (k === 'era' || k === 'whip') return td(k, fmtRate(r[k]), x);
      return bCell([k, , x], r);
    }

    async function init() {
      setupMoreToggle();
      const results = await Promise.all(GAME_LOG_YEARS.map(y => tryLoadJSON(`../data/personal/games/${y}.json`)));
      results.forEach((res, i) => {
        if (res.error) showError(`Could not load the ${GAME_LOG_YEARS[i]} game log (${res.error}).`);
        (res.data || []).forEach(g => allGames.push({ ...g, year: GAME_LOG_YEARS[i], when: gameKey(g) }));
      });
      populateFilters();
      ['yearFilter', 'teamFilter', 'opponentFilter', 'fieldFilter'].forEach(id =>
        document.getElementById(id).addEventListener('change', render));
      bindSort(document.querySelector('#gamelogTable thead'), bSort, render);
      bindSort(document.querySelector('#pitchingLogTable thead'), pSort, render);
      render();
    }

    function populateFilters() {
      const add = (id, vals) => { const s = document.getElementById(id); vals.forEach(v => s.add(new Option(v, v))); };
      const uniq = f => [...new Set(allGames.map(f).filter(Boolean))].sort();
      add('yearFilter', [...new Set(allGames.map(g => g.year))].sort((a, b) => b - a));
      add('teamFilter', uniq(g => g.team));
      add('opponentFilter', uniq(g => g.opponent));
      add('fieldFilter', uniq(g => g.field));
    }

    function render() {
      const v = id => document.getElementById(id).value;
      const year = +v('yearFilter') || null, team = v('teamFilter'), opp = v('opponentFilter'), field = v('fieldFilter');
      const games = allGames.filter(g => (!year || g.year === year) && (!team || g.team === team)
        && (!opp || g.opponent === opp) && (!field || g.field === field));

      // Batting
      const bRows = games.map(g => withRates({ ...g }));
      const bt = document.querySelector('#gamelogTable thead');
      bt.innerHTML = head(B_COLS); markSort(bt, bSort);
      document.querySelector('#gamelogTable tbody').innerHTML =
        sortRows(bRows, bSort).map(r => `<tr>${B_COLS.map(c => bCell(c, r)).join('')}</tr>`).join('')
        || `<tr><td colspan="${B_COLS.length}" class="empty">No games match.</td></tr>`;
      const tot = sumBatting(games.map(g => ({ ...g, w: resultLetter(g.result) === 'W' ? 1 : 0, l: resultLetter(g.result) === 'L' ? 1 : 0 })));
      document.querySelector('#gamelogTable tfoot').innerHTML = games.length ? `<tr class="total-row">${B_COLS.map(c =>
        c[0] === 'when' ? `<td>Totals</td>` : c[0] === 'result' ? `<td>${tot.w}-${tot.l}</td>`
        : ['team', 'opponent', 'field'].includes(c[0]) ? `<td${c[2] ? ' class="x"' : ''}></td>` : bCell(c, tot)).join('')}</tr>` : '';
      document.getElementById('battingMeta').textContent = `${games.length} games`;

      // Pitching
      const pitched = games.filter(g => g.pitching);
      document.getElementById('pitchingLog').hidden = !pitched.length;
      if (!pitched.length) return;
      const pRows = pitched.map(g => {
        const p = g.pitching, outs = ipToOuts(p.ip);
        return { ...g, outs, ip: p.ip, h: p.h || 0, r: p.r || 0, er: p.er || 0, bb: p.bb || 0, k: p.k || 0,
          era: eraOf(p.er || 0, outs), whip: whipOf(p.h || 0, p.bb || 0, outs) };
      });
      const pt = document.querySelector('#pitchingLogTable thead');
      pt.innerHTML = head(P_COLS); markSort(pt, pSort);
      document.querySelector('#pitchingLogTable tbody').innerHTML =
        sortRows(pRows, pSort).map(r => `<tr>${P_COLS.map(c => pCell(c, r)).join('')}</tr>`).join('');
      const ptot = sumPitching(pitched.map(g => ({ ...g.pitching })));
      document.querySelector('#pitchingLogTable tfoot').innerHTML = `<tr class="total-row">${P_COLS.map(c =>
        c[0] === 'when' ? '<td>Totals</td>' : ['team', 'opponent', 'result'].includes(c[0]) ? '<td></td>' : pCell(c, ptot)).join('')}</tr>`;
      document.getElementById('pitchingMeta').textContent = `${pitched.length} games`;
    }

    init();
  </script>
</body>
</html>
