<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hitting - Baseball Stats</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">⚾ Baseball Stats</a>
    <nav aria-label="Main">
      <a href="./" aria-current="page">Hitting</a>
      <a href="pitching.html">Pitching</a>
      <a href="gamelogs/">Game Logs</a>
      <a href="splits.html">Splits</a>
      <a href="royals/">World Series</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Hitting</h1>

    <section aria-labelledby="heroTitle">
      <h2 id="heroTitle" class="eyebrow">Current season</h2>
      <div class="hero" id="heroCard"></div>
    </section>

    <section aria-labelledby="seasonsTitle">
      <div class="section-head">
        <h2 id="seasonsTitle">Season Stats</h2>
        <div class="toolbar">
          <label>Year <select id="yearFilter"><option value="">All</option></select></label>
          <label>Team <select id="teamFilter"><option value="">All</option></select></label>
          <button type="button" class="chip" id="expandAll" aria-pressed="false">Expand all years</button>
          <button type="button" class="chip" id="moreToggle" aria-pressed="false">More stats</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="seasonTable"><thead></thead><tbody></tbody></table>
      </div>
    </section>

    <section aria-labelledby="careerTitle">
      <div class="section-head"><h2 id="careerTitle">Career by Team</h2></div>
      <div class="table-wrap">
        <table id="careerTable"><thead></thead><tbody></tbody><tfoot></tfoot></table>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
